{% extends "base.html" %}
{% block title %}Configuração inicial | PlenaVida{% endblock %}
{% block content %}
<section class="pagina-cabecalho">
  <p class="sobretitulo">Configuração inicial</p>
  <h1>Crie o primeiro acesso</h1>
  <p>Cadastre os dados do funcionário responsável pelo sistema.</p>
</section>
<section class="cartao formulario-cartao">
  <form method="post" class="formulario">
    <label for="token">Código de configuração</label>
    <input id="token" name="token" type="password" required autocomplete="off">

    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" type="text" required autocomplete="name">

    <label for="matricula">Matrícula ou identificação</label>
    <input id="matricula" name="matricula" type="text" required>

    <label for="usuario">Nome de usuário</label>
    <input id="usuario" name="usuario" type="text" required autocomplete="username">

    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" minlength="6" required autocomplete="new-password">

    <label for="confirmacao">Confirme a senha</label>
    <input id="confirmacao" name="confirmacao" type="password" minlength="6" required autocomplete="new-password">

    <button type="submit" class="botao-principal">Cadastrar funcionário</button>
  </form>
</section>
{% endblock %}
